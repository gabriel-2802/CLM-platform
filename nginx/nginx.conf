worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version from response headers and error pages.
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # General API zone — 30 req/s per IP with a burst allowance.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream user_service {
        server user-service:8083;
        keepalive 16;
    }

    upstream contract_service {
        server contracts:8081;
        keepalive 16;
    }

    upstream client_service {
        server client-service:8084;
        keepalive 16;
    }

    upstream swagger_hub {
        server swagger-hub:8090;
        keepalive 8;
    }

    upstream grafana {
        server grafana:3000;
        keepalive 8;
    }

    # TODO: remove when notification-service is no longer exposed in testing
    upstream notifications_service {
        server notifications:8082;
        keepalive 8;
    }

    upstream negotiation_service {
        server negotiation-service:8085;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}