<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CLM API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; }
    #nav {
      display: flex; align-items: center; gap: 8px;
      background: #1a1a1a; padding: 12px 20px; border-bottom: 1px solid #333;
      position: sticky; top: 0; z-index: 999;
    }
    #nav span { color: #aaa; font-size: 13px; margin-right: 4px; }
    .tab {
      padding: 7px 18px; border-radius: 6px; border: 1px solid #444;
      background: #2a2a2a; color: #ccc; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all .15s;
    }
    .tab:hover { border-color: #888; color: #fff; }
    .tab.active { background: #2d7d46; border-color: #2d7d46; color: #fff; }
    #swagger-ui { background: #fff; }
    .swagger-ui .topbar { display: none !important; }
  </style>
</head>
<body>
  <div id="nav">
    <span>Service:</span>
    <button class="tab active" onclick="load('contracts', this)">Contracts</button>
    <button class="tab"        onclick="load('user', this)">User</button>
    <button class="tab"        onclick="load('client', this)">Client</button>
    <button class="tab"        onclick="load('negotiations', this)">Negotiations</button>
    <span style="margin-left: 12px;">OpenAPI v3:</span>
    <button class="tab" onclick="openV3('contracts')">Contracts JSON</button>
    <button class="tab" onclick="openV3('user')">User JSON</button>
    <button class="tab" onclick="openV3('client')">Client JSON</button>
    <button class="tab" onclick="openV3('negotiations')">Negotiations JSON</button>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    // Relative URLs — resolves to /docs/proxy/* via Nginx, which forwards to
    // the swagger-hub server.py proxy. Using absolute /proxy/* would bypass
    // Nginx and land on Next.js (404).
    const urls = {
      contracts: './proxy/contracts',
      user:      './proxy/user',
      client:    './proxy/client',
      negotiations: './proxy/negotiations',
    };

    const v3Urls = {
      contracts: './proxy/contracts',
      user:      './proxy/user',
      client:    './proxy/client',
      negotiations: './proxy/negotiations',
    };

    let ui;
    function load(service, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('swagger-ui').innerHTML = '';
      ui = SwaggerUIBundle({
        url: urls[service],
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        deepLinking: true,
        tryItOutEnabled: true,
      });
    }

    function openV3(service) {
      window.open(v3Urls[service], '_blank', 'noopener');
    }

    ui = SwaggerUIBundle({
      url: urls.contracts,
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      deepLinking: true,
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
