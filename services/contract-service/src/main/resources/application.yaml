spring:
  application:
    name: demo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/demo_clm}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:clm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:clm_password}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    defer-datasource-initialization: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        default_schema: clm

  cache:
    type: caffeine

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    fail-on-missing-locations: false
    clean-disabled: true
    encoding: UTF-8

logging:
  level:
    org.docx4j.fonts: WARN
    org.docx4j.fonts.autodetect.FontInfoFinder: ERROR
    org.docx4j.fonts.PhysicalFonts: ERROR
    org.apache.fop.apps.FOUserAgent: ERROR

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

job:
  archive-contracts:
    cron: ${JOB_ARCHIVE_CONTRACTS_CRON:0 0 0 * * *}

placeholder:
  pattern: ${PLACEHOLDER_PATTERN:\\.{4,}(?:[ \\t]*\\.+)*}
  default: ${PLACEHOLDER_DEFAULT:....}

libreoffice:
  path: ${LIBREOFFICE_PATH:/Applications/LibreOffice.app/Contents/MacOS/soffice}

jwt:
  secret: ${JWT_SECRET:dev-shared-jwt-secret-used-by-both-nextauth-and-spring-change-before-deploy