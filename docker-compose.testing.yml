# ==============================================================================
# TESTING / DEVELOPMENT CONFIGURATION — NOT FOR PRODUCTION USE
# ==============================================================================
# All traffic enters through Nginx on :443 (HTTPS) and :80 (redirects to HTTPS).
# Spring services, Prometheus, and databases are on data-net only — no direct
# host port mappings except for the databases (for local psql access).
#
# Run with:
#   make certs   (first time only — generates self-signed TLS cert)
#   make test
#
# First-run after a clean volume:
#   make test-init
# ==============================================================================

services:

  # ── Main application database ──────────────────────────────────────────────
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: clm-db-contracts-test
    environment:
      POSTGRES_USER:        ${DB_USER:?DB_USER is required — check .env.testing}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      POSTGRES_DB:          ${DB_NAME:?DB_NAME is required — check .env.testing}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSE_PORT:-5433}:5432"
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_NAME:-clm_platform}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── User-service database ──────────────────────────────────────────────────
  postgres-users:
    image: postgres:16-alpine
    container_name: clm-db-users-test
    environment:
      POSTGRES_USER:        ${DB_USER:?DB_USER is required — check .env.testing}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      POSTGRES_DB:          ${DB_USERS_NAME:-clm_users}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    ports:
      - "${DB_USERS_EXPOSE_PORT:-5434}:5432"
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_USERS_NAME:-clm_users}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Client-service database ────────────────────────────────────────────────
  postgres-clients:
    image: postgres:16-alpine
    container_name: clm-db-clients-test
    environment:
      POSTGRES_USER:        ${DB_USER:?DB_USER is required — check .env.testing}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      POSTGRES_DB:          ${DB_CLIENTS_NAME:-clm_clients}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_clients_data:/var/lib/postgresql/data
    ports:
      - "${DB_CLIENTS_EXPOSE_PORT:-5435}:5432"
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_CLIENTS_NAME:-clm_clients}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── User service (auth + JWT) ──────────────────────────────────────────────
  # data-net only — not directly reachable from the host; all traffic via Nginx.
  user-service:
    build:
      context: services/user-service
      dockerfile: Dockerfile
    container_name: clm-user-service
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-users:5432/${DB_USERS_NAME:-clm_users}?currentSchema=users
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: users
      SPRING_FLYWAY_ENABLED:        "true"
      SPRING_FLYWAY_LOCATIONS:      classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:        users
      SPRING_FLYWAY_DEFAULT_SCHEMA: users
      JWT_SECRET:     ${JWT_SECRET:?JWT_SECRET is required — check .env.testing}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2592000000}
      APP_ADMIN_EMAIL:         ${ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD:      ${ADMIN_PASSWORD:-Admin123!}
      APP_ADMIN_NAME:          ${ADMIN_NAME:-Admin}
      APP_ADMIN_REGISTER_CODE:  ${ADMIN_REGISTER_CODE:-devcode123}
      APP_CORS_ALLOWED_ORIGINS: https://localhost
      SPRINGDOC_SWAGGER_UI_PATH:  /api/users/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/users/v3/api-docs
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       user-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_USER_DEMO:       DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_CONFIG_ANNOTATION_AUTHENTICATION_CONFIGURATION: ERROR
    depends_on:
      postgres-users:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Contract service ───────────────────────────────────────────────────────
  contracts:
    build:
      context: services/contract-service
      dockerfile: Dockerfile
    container_name: clm-contracts
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/${DB_NAME:-clm_platform}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clm
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   clm
      JWT_SECRET:          ${JWT_SECRET:?JWT_SECRET is required — check .env.testing}
      APP_JWT_SECRET:      ${JWT_SECRET:?JWT_SECRET is required — check .env.testing}
      APP_JWT_EXPIRATION:  ${JWT_EXPIRATION:-2592000000}
      APP_ADMIN_REGISTER_CODE: ${ADMIN_REGISTER_CODE:-devcode123}
      SPRING_MAIL_HOST:                                   ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT:                                   ${MAIL_PORT:-2525}
      SPRING_MAIL_USERNAME:                               ${MAIL_USERNAME:-your-mailtrap-username}
      SPRING_MAIL_PASSWORD:                               ${MAIL_PASSWORD:-your-mailtrap-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:              "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:   "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SPRING_MAIL_FROM:                                   ${MAIL_FROM:-noreply@dev.example.com}
      APP_EMAIL_VERIFICATION_EXPIRATION: ${EMAIL_VERIFICATION_EXPIRATION:-86400000}
      APP_FRONTEND_URL:                ${FRONTEND_URL:-https://localhost}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: https://localhost
      LIBREOFFICE_PATH: ${LIBREOFFICE_PATH:-/usr/bin/libreoffice}
      SPRINGDOC_SWAGGER_UI_PATH:  /api/contracts/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/contracts/v3/api-docs
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       contract-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_DEMO:            DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Client service ─────────────────────────────────────────────────────────
  client-service:
    build:
      context: services/client-service
      dockerfile: Dockerfile
    container_name: clm-client-service
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-clients:5432/${DB_CLIENTS_NAME:-clm_clients}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clients
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   clients
      JWT_SECRET:           ${JWT_SECRET:?JWT_SECRET is required — check .env.testing}
      CORS_ALLOWED_ORIGINS: https://localhost
      SPRINGDOC_SWAGGER_UI_PATH:  /api/clients/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/clients/v3/api-docs
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       client-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
    depends_on:
      postgres-clients:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Notification service ───────────────────────────────────────────────────
  notifications:
    build:
      context: services/notification-service
      dockerfile: Dockerfile
    container_name: clm-notifications
    environment:
      SPRING_MAIL_HOST:                                  ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT:                                  ${MAIL_PORT:-2525}
      SPRING_MAIL_USERNAME:                              ${MAIL_USERNAME:-your-mailtrap-username}
      SPRING_MAIL_PASSWORD:                              ${MAIL_PASSWORD:-your-mailtrap-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:             "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:  "true"
      SPRING_MAIL_FROM:                                  ${MAIL_FROM:-noreply@dev.example.com}
      CONTRACTS_SERVICE_URL:  ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      CONTRACTS_API_BASE_URL: ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      JWT_SECRET:             ${JWT_SECRET:?JWT_SECRET is required — check .env.testing}
      NOTIFICATION_RECIPIENTS: ${NOTIFICATION_RECIPIENTS:-}
      APP_FRONTEND_URL:                ${FRONTEND_URL:-https://localhost}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: https://localhost
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_NOTIFICATIONS:   DEBUG
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3

  # ── Negotiation-service database ──────────────────────────────────────────
  postgres-negotiations:
    image: postgres:16-alpine
    container_name: clm-db-negotiations-test
    environment:
      POSTGRES_USER:        ${DB_USER:?DB_USER is required — check .env.testing}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      POSTGRES_DB:          ${DB_NEGOTIATIONS_NAME:-clm_negotiations}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_negotiations_data:/var/lib/postgresql/data
    ports:
      - "${DB_NEGOTIATIONS_EXPOSE_PORT:-5436}:5432"
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_NEGOTIATIONS_NAME:-clm_negotiations}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Negotiation service ────────────────────────────────────────────────────
  negotiation-service:
    build:
      context: services/negotiation-service
      dockerfile: Dockerfile
    container_name: clm-negotiation-service
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-negotiations:5432/${DB_NEGOTIATIONS_NAME:-clm_negotiations}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:?DB_PASSWORD is required — check .env.testing}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: negotiations
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   negotiations
      JWT_SECRET:              ${JWT_SECRET:?JWT_SECRET is required — check .env.testing}
      CONTRACTS_SERVICE_URL:   http://contracts:8081
      SPRINGDOC_SWAGGER_UI_PATH:  /api/negotiations/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/negotiations/v3/api-docs
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       negotiation-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_NEGOTIATION:     DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
      SPRING_MAIL_HOST:                                   ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT:                                   ${MAIL_PORT:-2525}
      SPRING_MAIL_USERNAME:                               ${MAIL_USERNAME:-your-mailtrap-username}
      SPRING_MAIL_PASSWORD:                               ${MAIL_PASSWORD:-your-mailtrap-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:              "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:   "true"
      NOTIFICATION_FROM:                                  ${MAIL_FROM:-noreply@dev.example.com}
      NOTIFICATION_RECIPIENTS:                            ${NOTIFICATION_RECIPIENTS:-}
      NEGOTIATION_NOTIFICATION_CRON:                      ${NEGOTIATION_NOTIFICATION_CRON:-0 0 9 1 * *}
    depends_on:
      postgres-negotiations:
        condition: service_healthy
      contracts:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Swagger hub ────────────────────────────────────────────────────────────
  swagger-hub:
    build:
      context: swagger-hub
      dockerfile: Dockerfile
    container_name: clm-swagger-hub
    environment:
      PORT: "8090"
    networks:
      - data-net
    restart: on-failure:3

  # ── Frontend (Next.js dev server) ──────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: clm-frontend
    environment:
      NODE_ENV:                 production
      NEXT_TELEMETRY_DISABLED:  "1"
      # Browser-side URLs — all go through Nginx now.
      NEXT_PUBLIC_API_BASE_URL:          ${NEXT_PUBLIC_API_BASE_URL:-https://localhost}
      NEXT_PUBLIC_CONTRACTS_API_URL:     ${NEXT_PUBLIC_CONTRACTS_API_URL:-https://localhost/api/contracts}
      NEXT_PUBLIC_NOTIFICATIONS_API_URL: ${NEXT_PUBLIC_NOTIFICATIONS_API_URL:-https://localhost/api/notifications}
      NEXT_PUBLIC_USER_SERVICE_URL:      ${NEXT_PUBLIC_USER_SERVICE_URL:-https://localhost/api/users}
      NEXT_PUBLIC_CLIENT_SERVICE_URL:    ${NEXT_PUBLIC_CLIENT_SERVICE_URL:-https://localhost/api/clients}
      # Server-side URLs — direct internal Docker network calls, bypass Nginx.
      CONTRACTS_SERVICE_URL:     http://contracts:8081
      NOTIFICATIONS_SERVICE_URL: http://notifications:8082
      USER_SERVICE_URL:          http://user-service:8083
      CLIENT_SERVICE_URL:        http://client-service:8084
      NEGOTIATION_SERVICE_URL:   http://negotiation-service:8085
      ADMIN_REGISTER_CODE:  ${ADMIN_REGISTER_CODE:-devcode123}
      NEXTAUTH_URL:    ${FRONTEND_URL:-https://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — check .env.testing}
    depends_on:
      contracts:
        condition: service_healthy
      notifications:
        condition: service_started
      user-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Prometheus ─────────────────────────────────────────────────────────────
  # data-net only — never exposed externally. Grafana reads from it internally.
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: clm-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    depends_on:
      user-service:
        condition: service_healthy
      contracts:
        condition: service_healthy
      client-service:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    build:
      context: monitoring/grafana
      dockerfile: Dockerfile
    container_name: clm-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-Admin123!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Serve Grafana from the /grafana subpath behind Nginx.
      - GF_SERVER_ROOT_URL=https://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - TZ=UTC
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Nginx (reverse proxy / TLS termination) ────────────────────────────────
  # Single entry point for all external traffic.
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: clm-nginx
    volumes:
      # Certs mounted at runtime — never baked into the image.
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      user-service:
        condition: service_healthy
      contracts:
        condition: service_healthy
      client-service:
        condition: service_healthy
      negotiation-service:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - dmz-net
      - data-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # dmz-net: only Nginx lives here — the single external-facing bridge.
  dmz-net:
    driver: bridge
  # data-net: all internal services — never reachable directly from outside.
  data-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  postgres_users_data:
    driver: local
  postgres_clients_data:
    driver: local
  postgres_negotiations_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
