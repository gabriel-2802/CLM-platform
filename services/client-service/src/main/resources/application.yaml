spring:
  application:
    name: client-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5445/client_platform}
    username: ${SPRING_DATASOURCE_USERNAME:client_user}
    password: ${SPRING_DATASOURCE_PASSWORD:client_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:clients}
    open-in-view: false
  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:clients}

server:
  port: ${SERVER_PORT:8084}

# REQUIRED in production: set JWT_SECRET to a cryptographically random string
# of at least 32 characters. The fallback is for local development ONLY.
jwt:
  secret: ${JWT_SECRET:dev-shared-jwt-secret-used-by-both-nextauth-and-spring-change-before-deploy}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
