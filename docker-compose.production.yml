# ==============================================================================
# PRODUCTION CONFIGURATION
# ==============================================================================
# Pre-flight checklist — verify ALL items before deploying:
#   [ ] .env.production has no empty secret values
#   [ ] JWT_SECRET is at least 64 random characters
#   [ ] DB_PASSWORD is strong and unique (not reused from dev/test)
#   [ ] ADMIN_REGISTER_CODE is changed from any testing value
#   [ ] ADMIN_EMAIL / ADMIN_PASSWORD set to real admin credentials
#   [ ] MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD point to a real SMTP provider
#   [ ] FRONTEND_URL is set to your actual public domain (used for CORS + NextAuth)
#   [ ] NEXT_PUBLIC_* URLs are reachable from end-user browsers
#   [ ] NEXTAUTH_SECRET is at least 32 random characters
#   [ ] next.config.ts has `output: 'standalone'` enabled for the client build
#   [ ] A reverse proxy (Nginx/Caddy/Traefik) handles TLS termination in front of port 3000
#   [ ] Run `docker compose -f docker-compose.production.yml config` to validate YAML
#   [ ] Run `docker compose -p clm-prod -f docker-compose.production.yml --env-file .env.production up -d`
#
# SECURITY NOTE — credentials in environment variables:
#   DATABASE_URL and SPRING_DATASOURCE_PASSWORD are visible via `docker inspect`
#   and in any log that prints env vars. For high-security deployments use Docker
#   secrets or a secrets manager (Vault, AWS Secrets Manager) and mount them as
#   files, reading them at runtime. The current approach is acceptable for most
#   deployments provided the host itself is hardened and Docker socket access
#   (/var/run/docker.sock) is not granted to any container.
#   [ ] Confirm no container mounts /var/run/docker.sock
# ==============================================================================

services:

  # ── Main application database (clients, tasks, contracts) ──────────────────
  postgres:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: clm-postgres-prod
    environment:
      POSTGRES_USER:         ${DB_USER}
      POSTGRES_PASSWORD:     ${DB_PASSWORD}
      POSTGRES_DB:           ${DB_NAME}
      POSTGRES_INITDB_ARGS:  "--encoding=UTF8"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── User-service database (users schema — owned exclusively by user-service) ─
  postgres-users:
    image: postgres:16-alpine
    container_name: clm-postgres-users-prod
    environment:
      POSTGRES_USER:         ${DB_USER}
      POSTGRES_PASSWORD:     ${DB_PASSWORD}
      POSTGRES_DB:           ${DB_USERS_NAME:-clm_users}
      POSTGRES_INITDB_ARGS:  "--encoding=UTF8"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    networks:
      - data-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_USERS_NAME:-clm_users}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Client-service database (clients schema — owned exclusively by client-service) ─
  postgres-clients:
    image: postgres:16-alpine
    container_name: clm-postgres-clients-prod
    environment:
      POSTGRES_USER:         ${DB_USER}
      POSTGRES_PASSWORD:     ${DB_PASSWORD}
      POSTGRES_DB:           ${DB_CLIENTS_NAME:-clm_clients}
      POSTGRES_INITDB_ARGS:  "--encoding=UTF8"
    volumes:
      - postgres_clients_data:/var/lib/postgresql/data
    networks:
      - data-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_CLIENTS_NAME:-clm_clients}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── User service (auth + user management) ──────────────────────────────────
  user-service:
    build:
      context: user-service
      dockerfile: Dockerfile
    container_name: clm-user-service-prod
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # --- Database ---
      SPRING_DATASOURCE_URL:                jdbc:postgresql://postgres-users:5432/${DB_USERS_NAME:-clm_users}
      SPRING_DATASOURCE_USERNAME:           ${DB_USER}
      SPRING_DATASOURCE_PASSWORD:           ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME:  org.postgresql.Driver
      # --- JPA ---
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:     org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: users
      # --- Flyway ---
      SPRING_FLYWAY_ENABLED:    "true"
      SPRING_FLYWAY_LOCATIONS:  classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:    users
      # --- JWT ---
      JWT_SECRET:      ${JWT_SECRET}
      JWT_EXPIRATION:  ${JWT_EXPIRATION:-2592000000}
      # --- Admin seed ---
      APP_ADMIN_EMAIL:          ${ADMIN_EMAIL}
      APP_ADMIN_PASSWORD:       ${ADMIN_PASSWORD}
      APP_ADMIN_NAME:           ${ADMIN_NAME:-Admin}
      APP_ADMIN_REGISTER_CODE:  ${ADMIN_REGISTER_CODE}
      # --- CORS ---
      CORS_ALLOWED_ORIGINS:  ${FRONTEND_URL}
      # --- Server ---
      SERVER_PORT:  8083
      # --- Spring profile ---
      SPRING_PROFILES_ACTIVE:  ${SPRING_PROFILES_ACTIVE:-prod}
      # --- Logging ---
      LOGGING_LEVEL_ROOT:                  WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:   WARN
    depends_on:
      postgres-users:
        condition: service_healthy
    networks:
      - dmz-net
      - data-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8083"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  contracts:
    build:
      context: contract-service
      dockerfile: Dockerfile
    container_name: clm-contracts-prod
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # --- Database ---
      SPRING_DATASOURCE_URL:                jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME:           ${DB_USER}
      SPRING_DATASOURCE_PASSWORD:           ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME:  org.postgresql.Driver
      # --- JPA ---
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:     org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clm
      # --- Flyway ---
      SPRING_FLYWAY_ENABLED:    "true"
      SPRING_FLYWAY_LOCATIONS:  classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:    clm
      # --- JWT ---
      JWT_SECRET:          ${JWT_SECRET}
      APP_JWT_SECRET:      ${JWT_SECRET}
      APP_JWT_EXPIRATION:  ${JWT_EXPIRATION:-2592000000}
      # --- Admin ---
      APP_ADMIN_REGISTER_CODE:  ${ADMIN_REGISTER_CODE}
      # --- Mail ---
      SPRING_MAIL_HOST:                                    ${MAIL_HOST}
      SPRING_MAIL_PORT:                                    ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME:                                ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD:                                ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:               "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:    "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:  "true"
      SPRING_MAIL_FROM:                                    ${MAIL_FROM}
      APP_EMAIL_VERIFICATION_EXPIRATION:  ${EMAIL_VERIFICATION_EXPIRATION:-86400000}
      # --- URLs / CORS ---
      APP_FRONTEND_URL:                 ${FRONTEND_URL}
      SPRING_WEB_CORS_ALLOWED_ORIGINS:  ${FRONTEND_URL}
      # --- LibreOffice ---
      LIBREOFFICE_PATH:  ${LIBREOFFICE_PATH:-/usr/bin/libreoffice}
      HOME:              /tmp
      # --- Server ---
      SERVER_PORT:  8081
      # --- Spring profile ---
      SPRING_PROFILES_ACTIVE:  ${SPRING_PROFILES_ACTIVE:-prod}
      # --- Logging ---
      LOGGING_LEVEL_ROOT:                  WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:   WARN
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dmz-net
      - data-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    mem_reservation: 384m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8081"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  client-service:
    build:
      context: client-service
      dockerfile: Dockerfile
    container_name: clm-client-service-prod
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # --- Database (dedicated postgres-clients instance) ---
      SPRING_DATASOURCE_URL:                jdbc:postgresql://postgres-clients:5432/${DB_CLIENTS_NAME:-clm_clients}
      SPRING_DATASOURCE_USERNAME:           ${DB_USER}
      SPRING_DATASOURCE_PASSWORD:           ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME:  org.postgresql.Driver
      # --- JPA ---
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:     org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clients
      # --- Flyway ---
      SPRING_FLYWAY_ENABLED:    "true"
      SPRING_FLYWAY_LOCATIONS:  classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:    clients
      # --- JWT ---
      JWT_SECRET:  ${JWT_SECRET}
      # --- CORS ---
      CORS_ALLOWED_ORIGINS:  ${FRONTEND_URL}
      # --- Server ---
      SERVER_PORT:  8084
      # --- Spring profile ---
      SPRING_PROFILES_ACTIVE:  ${SPRING_PROFILES_ACTIVE:-prod}
      # --- Logging ---
      LOGGING_LEVEL_ROOT:                  WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:   WARN
    depends_on:
      postgres-clients:
        condition: service_healthy
    networks:
      - dmz-net
      - data-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8084"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  notifications:
    build:
      context: notification-service
      dockerfile: Dockerfile
    container_name: clm-notifications-prod
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # --- Mail ---
      SPRING_MAIL_HOST:                                    ${MAIL_HOST}
      SPRING_MAIL_PORT:                                    ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME:                                ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD:                                ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:               "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:    "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:  "true"
      SPRING_MAIL_FROM:                                    ${MAIL_FROM}
      # --- Service URLs ---
      CONTRACTS_SERVICE_URL:   ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      CONTRACTS_API_BASE_URL:  ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      # --- URLs / CORS ---
      APP_FRONTEND_URL:                 ${FRONTEND_URL}
      SPRING_WEB_CORS_ALLOWED_ORIGINS:  ${FRONTEND_URL}
      # --- Server ---
      SERVER_PORT:  8082
      # --- Spring profile ---
      SPRING_PROFILES_ACTIVE:  ${SPRING_PROFILES_ACTIVE:-prod}
      # --- Logging ---
      LOGGING_LEVEL_ROOT:                  WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:   WARN
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dmz-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8082"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  client:
    build:
      context: main-service
      dockerfile: Dockerfile
      target: runner
    container_name: clm-client-prod
    environment:
      # --- Node ---
      NODE_ENV:                 production
      NEXT_TELEMETRY_DISABLED:  "1"
      NEXT_TELEMETRY_DEBUG:     "0"
      # --- Public API URLs (resolved in end-user browsers) ---
      NEXT_PUBLIC_CONTRACTS_API_URL:      ${NEXT_PUBLIC_CONTRACTS_API_URL}
      NEXT_PUBLIC_NOTIFICATIONS_API_URL:  ${NEXT_PUBLIC_NOTIFICATIONS_API_URL}
      NEXT_PUBLIC_USER_SERVICE_URL:       ${NEXT_PUBLIC_USER_SERVICE_URL}
      NEXT_PUBLIC_CLIENT_SERVICE_URL:     ${NEXT_PUBLIC_CLIENT_SERVICE_URL}
      # --- Server-side URLs (resolved inside Docker network) ---
      API_BASE_URL:               http://contracts:8081
      CONTRACTS_SERVICE_URL:      ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      NOTIFICATIONS_SERVICE_URL:  ${NOTIFICATIONS_SERVICE_URL:-http://notifications:8082}
      USER_SERVICE_URL:           http://user-service:8083
      CLIENT_SERVICE_URL:         http://client-service:8084
      # --- Admin credentials ---
      ADMIN_REGISTER_CODE:  ${ADMIN_REGISTER_CODE}
      # --- NextAuth ---
      NEXTAUTH_URL:     ${FRONTEND_URL}
      NEXTAUTH_SECRET:  ${NEXTAUTH_SECRET}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      contracts:
        condition: service_healthy
      notifications:
        condition: service_healthy
      user-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
    networks:
      - dmz-net
      - data-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  dmz-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  postgres_users_data:
    driver: local
  postgres_clients_data:
    driver: local
