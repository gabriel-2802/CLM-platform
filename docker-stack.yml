# ==============================================================================
# CLM Platform — Docker Swarm Stack
# ==============================================================================
# Single file for testing and production.  Only secrets differ between
# environments; swagger-hub is disabled in production via SWAGGER_HUB_REPLICAS.
#
# TESTING:    make swarm-deploy-test
# PRODUCTION: make swarm-deploy-prod
#
# First-time setup:
#   1. docker swarm init          (once per host)
#   2. make certs                 (testing only — generates self-signed TLS)
#   3. make swarm-config-create   (creates prometheus Docker config)
#   4. make swarm-secrets-test    (testing)
#      make swarm-secrets-prod    (production — requires .env.secrets)
#   5. make swarm-build-test      (testing — builds local images)
#      push images to registry    (production)
#   6. make swarm-deploy-test     OR  make swarm-deploy-prod
# ==============================================================================

x-restart: &restart
  condition: on-failure
  max_attempts: 3
  delay: 5s

# ── Secrets (all created externally — see scripts/secrets-init.sh) ────────────
secrets:
  clm_db_password:
    external: true
  clm_jwt_secret:
    external: true
  clm_nextauth_secret:
    external: true
  clm_admin_password:
    external: true
  clm_admin_register_code:
    external: true
  clm_mail_username:
    external: true
  clm_mail_password:
    external: true
  clm_grafana_password:
    external: true
  clm_tls_cert:
    external: true
  clm_tls_key:
    external: true

# ── Configs (created externally — see make swarm-config-create) ───────────────
configs:
  clm_prometheus_config:
    external: true

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # clm-edge: nginx only — the single external-facing tier.
  clm-edge:
    driver: overlay
    attachable: false
  # clm-backend: all internal services and nginx — never reachable from outside.
  clm-backend:
    driver: overlay
    attachable: false

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  postgres_users_data:
  postgres_clients_data:
  postgres_negotiations_data:
  prometheus_data:
  grafana_data:

services:

  # ── Main application database ───────────────────────────────────────────────
  postgres:
    image: ${IMAGE_PREFIX:-}clm-db:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_USER:          ${DB_USER:-clm_user}
      POSTGRES_DB:            ${DB_NAME:-clm_platform}
      POSTGRES_INITDB_ARGS:   "--encoding=UTF8"
      POSTGRES_PASSWORD_FILE: /run/secrets/clm_db_password
    secrets:
      - clm_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_NAME:-clm_platform}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy: *restart

  # ── User-service database ───────────────────────────────────────────────────
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:          ${DB_USER:-clm_user}
      POSTGRES_DB:            ${DB_USERS_NAME:-clm_users}
      POSTGRES_INITDB_ARGS:   "--encoding=UTF8"
      POSTGRES_PASSWORD_FILE: /run/secrets/clm_db_password
    secrets:
      - clm_db_password
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_USERS_NAME:-clm_users}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy: *restart

  # ── Client-service database ─────────────────────────────────────────────────
  postgres-clients:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:          ${DB_USER:-clm_user}
      POSTGRES_DB:            ${DB_CLIENTS_NAME:-clm_clients}
      POSTGRES_INITDB_ARGS:   "--encoding=UTF8"
      POSTGRES_PASSWORD_FILE: /run/secrets/clm_db_password
    secrets:
      - clm_db_password
    volumes:
      - postgres_clients_data:/var/lib/postgresql/data
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_CLIENTS_NAME:-clm_clients}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy: *restart

  # ── Negotiation-service database ────────────────────────────────────────────
  postgres-negotiations:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:          ${DB_USER:-clm_user}
      POSTGRES_DB:            ${DB_NEGOTIATIONS_NAME:-clm_negotiations}
      POSTGRES_INITDB_ARGS:   "--encoding=UTF8"
      POSTGRES_PASSWORD_FILE: /run/secrets/clm_db_password
    secrets:
      - clm_db_password
    volumes:
      - postgres_negotiations_data:/var/lib/postgresql/data
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_NEGOTIATIONS_NAME:-clm_negotiations}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy: *restart

  # ── User service ────────────────────────────────────────────────────────────
  # Secrets injected by docker-entrypoint.sh:
  #   clm_db_password        → SPRING_DATASOURCE_PASSWORD
  #   clm_jwt_secret         → JWT_SECRET
  #   clm_admin_password     → APP_ADMIN_PASSWORD
  #   clm_admin_register_code → APP_ADMIN_REGISTER_CODE
  user-service:
    image: ${IMAGE_PREFIX:-}clm-user-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-users:5432/${DB_USERS_NAME:-clm_users}?currentSchema=users
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: users
      SPRING_FLYWAY_ENABLED:        "true"
      SPRING_FLYWAY_LOCATIONS:      classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:        users
      SPRING_FLYWAY_DEFAULT_SCHEMA: users
      JWT_EXPIRATION:          ${JWT_EXPIRATION:-2592000000}
      APP_ADMIN_EMAIL:         ${ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_NAME:          ${ADMIN_NAME:-Admin}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-https://localhost}
      SPRINGDOC_SWAGGER_UI_PATH: /api/users/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:   /api/users/v3/api-docs
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       user-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_USER_DEMO:       DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_CONFIG_ANNOTATION_AUTHENTICATION_CONFIGURATION: ERROR
    secrets:
      - clm_db_password
      - clm_jwt_secret
      - clm_admin_password
      - clm_admin_register_code
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      restart_policy: *restart

  # ── Contract service ────────────────────────────────────────────────────────
  # Secrets injected by docker-entrypoint.sh:
  #   clm_db_password         → SPRING_DATASOURCE_PASSWORD
  #   clm_jwt_secret          → JWT_SECRET, APP_JWT_SECRET
  #   clm_admin_register_code → APP_ADMIN_REGISTER_CODE
  #   clm_mail_username       → SPRING_MAIL_USERNAME
  #   clm_mail_password       → SPRING_MAIL_PASSWORD
  contracts:
    image: ${IMAGE_PREFIX:-}clm-contracts:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/${DB_NAME:-clm_platform}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clm
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   clm
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2592000000}
      SPRING_MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT: ${MAIL_PORT:-2525}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:              "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:   "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SPRING_MAIL_FROM:                                   ${MAIL_FROM:-noreply@dev.example.com}
      APP_EMAIL_VERIFICATION_EXPIRATION: ${EMAIL_VERIFICATION_EXPIRATION:-86400000}
      APP_FRONTEND_URL:                ${FRONTEND_URL:-https://localhost}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-https://localhost}
      NEGOTIATION_SERVICE_URL: ${NEGOTIATION_SERVICE_URL:-http://negotiation-service:8085}
      LIBREOFFICE_PATH:        ${LIBREOFFICE_PATH:-/usr/bin/libreoffice}
      SPRINGDOC_SWAGGER_UI_PATH: /api/contracts/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:   /api/contracts/v3/api-docs
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       contract-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_DEMO:            DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
    secrets:
      - clm_db_password
      - clm_jwt_secret
      - clm_admin_register_code
      - clm_mail_username
      - clm_mail_password
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      restart_policy: *restart

  # ── Client service ──────────────────────────────────────────────────────────
  # Secrets injected by docker-entrypoint.sh:
  #   clm_db_password  → SPRING_DATASOURCE_PASSWORD
  #   clm_jwt_secret   → JWT_SECRET
  client-service:
    image: ${IMAGE_PREFIX:-}clm-client-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-clients:5432/${DB_CLIENTS_NAME:-clm_clients}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clients
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   clients
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-https://localhost}
      SPRINGDOC_SWAGGER_UI_PATH: /api/clients/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:   /api/clients/v3/api-docs
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       client-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
    secrets:
      - clm_db_password
      - clm_jwt_secret
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      restart_policy: *restart

  # ── Notification service ────────────────────────────────────────────────────
  # Secrets injected by docker-entrypoint.sh:
  #   clm_jwt_secret     → JWT_SECRET
  #   clm_mail_username  → SPRING_MAIL_USERNAME
  #   clm_mail_password  → SPRING_MAIL_PASSWORD
  notifications:
    image: ${IMAGE_PREFIX:-}clm-notifications:${IMAGE_TAG:-latest}
    environment:
      SPRING_MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT: ${MAIL_PORT:-2525}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:            "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_FROM:                                 ${MAIL_FROM:-noreply@dev.example.com}
      CONTRACTS_SERVICE_URL:   ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      CONTRACTS_API_BASE_URL:  ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      NOTIFICATION_RECIPIENTS: ${NOTIFICATION_RECIPIENTS:-}
      APP_FRONTEND_URL:                ${FRONTEND_URL:-https://localhost}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-https://localhost}
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_NOTIFICATIONS:   DEBUG
    secrets:
      - clm_jwt_secret
      - clm_mail_username
      - clm_mail_password
    networks:
      - clm-backend
    deploy:
      restart_policy: *restart

  # ── Negotiation service ─────────────────────────────────────────────────────
  # Secrets injected by docker-entrypoint.sh:
  #   clm_db_password    → SPRING_DATASOURCE_PASSWORD
  #   clm_jwt_secret     → JWT_SECRET
  #   clm_mail_username  → SPRING_MAIL_USERNAME
  #   clm_mail_password  → SPRING_MAIL_PASSWORD
  negotiation-service:
    image: ${IMAGE_PREFIX:-}clm-negotiation-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-negotiations:5432/${DB_NEGOTIATIONS_NAME:-clm_negotiations}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: negotiations
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   negotiations
      JWT_EXPIRATION:        ${JWT_EXPIRATION:-2592000000}
      CONTRACTS_SERVICE_URL: http://contracts:8081
      SPRINGDOC_SWAGGER_UI_PATH: /api/negotiations/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:   /api/negotiations/v3/api-docs
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       negotiation-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_NEGOTIATION:     DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
      SPRING_MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT: ${MAIL_PORT:-2525}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:            "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      NOTIFICATION_FROM:       ${MAIL_FROM:-noreply@dev.example.com}
      NOTIFICATION_RECIPIENTS: ${NOTIFICATION_RECIPIENTS:-}
      NEGOTIATION_NOTIFICATION_CRON: ${NEGOTIATION_NOTIFICATION_CRON:-0 0 9 1 * *}
    secrets:
      - clm_db_password
      - clm_jwt_secret
      - clm_mail_username
      - clm_mail_password
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      restart_policy: *restart

  # ── Swagger hub — disabled in production via SWAGGER_HUB_REPLICAS=0 ─────────
  swagger-hub:
    image: ${IMAGE_PREFIX:-}clm-swagger-hub:${IMAGE_TAG:-latest}
    environment:
      PORT: "8090"
    networks:
      - clm-backend
    deploy:
      replicas: ${SWAGGER_HUB_REPLICAS:-1}
      restart_policy: *restart

  # ── Frontend ────────────────────────────────────────────────────────────────
  # Secrets injected by docker-entrypoint.sh:
  #   clm_nextauth_secret     → NEXTAUTH_SECRET
  #   clm_admin_register_code → ADMIN_REGISTER_CODE
  frontend:
    image: ${IMAGE_PREFIX:-}clm-frontend:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV:                production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL:          ${NEXT_PUBLIC_API_BASE_URL:-https://localhost}
      NEXT_PUBLIC_CONTRACTS_API_URL:     ${NEXT_PUBLIC_CONTRACTS_API_URL:-https://localhost/api/contracts}
      NEXT_PUBLIC_NOTIFICATIONS_API_URL: ${NEXT_PUBLIC_NOTIFICATIONS_API_URL:-https://localhost/api/notifications}
      NEXT_PUBLIC_USER_SERVICE_URL:      ${NEXT_PUBLIC_USER_SERVICE_URL:-https://localhost/api/users}
      NEXT_PUBLIC_CLIENT_SERVICE_URL:    ${NEXT_PUBLIC_CLIENT_SERVICE_URL:-https://localhost/api/clients}
      CONTRACTS_SERVICE_URL:     http://contracts:8081
      NOTIFICATIONS_SERVICE_URL: http://notifications:8082
      USER_SERVICE_URL:          http://user-service:8083
      CLIENT_SERVICE_URL:        http://client-service:8084
      NEGOTIATION_SERVICE_URL:   http://negotiation-service:8085
      NEXTAUTH_URL: ${FRONTEND_URL:-https://localhost}
    secrets:
      - clm_nextauth_secret
      - clm_admin_register_code
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      restart_policy: *restart

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    environment:
      TZ: UTC
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    configs:
      - source: clm_prometheus_config
        target: /etc/prometheus/prometheus.yml
        mode: 0444
    volumes:
      - prometheus_data:/prometheus
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy: *restart

  # ── Grafana ─────────────────────────────────────────────────────────────────
  # Password read natively by Grafana via GF_SECURITY_ADMIN_PASSWORD__FILE.
  grafana:
    image: ${IMAGE_PREFIX:-}clm-grafana:${IMAGE_TAG:-latest}
    environment:
      GF_SECURITY_ADMIN_USER:           ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/clm_grafana_password
      GF_USERS_ALLOW_SIGN_UP:           "false"
      GF_SECURITY_DISABLE_GRAVATAR:     "true"
      GF_ANALYTICS_REPORTING_ENABLED:   "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES:   "false"
      GF_SERVER_ROOT_URL:               ${FRONTEND_URL:-https://localhost}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH:    "true"
      TZ: UTC
    secrets:
      - clm_grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - clm-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy: *restart

  # ── Nginx — single entry point, bridges clm-edge and clm-backend ────────────
  # TLS cert/key mounted directly at the paths nginx.conf expects.
  nginx:
    image: ${IMAGE_PREFIX:-}clm-nginx:${IMAGE_TAG:-latest}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    secrets:
      - source: clm_tls_cert
        target: /etc/nginx/certs/clm.crt
        mode: 0444
      - source: clm_tls_key
        target: /etc/nginx/certs/clm.key
        mode: 0400
    networks:
      - clm-edge
      - clm-backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy: *restart
