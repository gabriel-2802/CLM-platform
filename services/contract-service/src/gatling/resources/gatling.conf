# =============================================================================
# Gatling Configuration — CLM Contract Service Load Tests
# =============================================================================
# This file is loaded from the classpath at simulation startup.
# Values here act as defaults; most can also be overridden via system properties.
# Full reference: https://gatling.io/docs/gatling/reference/current/core/configuration/
# =============================================================================

gatling {

  core {
    encoding = "utf-8"

    # ---- Simulation identification in reports ----
    runDescription = "CLM Contract-Service Load Test"

    # Directory for extracting bundled resources (bodies, data, etc.)
    # Default: ${GATLING_HOME}/results  or  the resultsFolder configured in the plugin.
    # Overridden by the Maven plugin's <resultsFolder> configuration.
    # directory = "results"

    # ---- Throughput throttle (requests/second, global) ----
    # Uncomment to add a hard global RPS cap across all scenarios.
    # Useful when the target is a shared environment with strict rate limits.
    # throttle {
    #   reachRps = 100
    #   holdFor = 300 seconds
    # }

    # ---- Extract & buffer tuning ----
    extract {
      regex    { cacheMaxCapacity = 200 }
      xpath    { cacheMaxCapacity = 200 }
      jsonPath { cacheMaxCapacity = 200 }
      css      { cacheMaxCapacity = 200 }
    }
  }

  charting {
    # ---- Time-series bucket width in milliseconds ----
    # Smaller value = finer resolution charts; larger = less memory overhead.
    maxPlotPerSeries = 1000

    # ---- Percentile thresholds tracked in the HTML report ----
    # These four buckets appear in the "Response Time Distribution" histogram.
    indicators {
      lowerBound  = 800   # ms — "good" (green bar)
      higherBound = 1200  # ms — "acceptable" / "slow" boundary
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }

  http {
    # ---- Connection pool settings ----
    # Keep connections alive for the full simulation to reduce TLS handshake overhead.
    pooledConnectionIdleTimeout     = 60000   # ms
    connectionTimeout               = 10000   # ms — fail fast on unreachable host

    # ---- Per-request timeouts ----
    requestTimeout = 30000  # ms — matches the .requestTimeout(30s) in the protocol builder

    # ---- DNS ----
    # Disable async DNS so responses come from the OS resolver (predictable in CI).
    asyncNameResolution = false

    # ---- TLS ----
    # The nginx reverse proxy uses a self-signed certificate on https://localhost.
    # Both options below are required: hostname verification covers the CN check;
    # useInsecureTrustManager bypasses the CA chain validation for self-signed certs.
    # Set BOTH to true / remove these lines when targeting a production host with
    # a cert signed by a public CA.
    enableHostnameVerification = false

    ssl {
      # Accept any certificate (self-signed or otherwise) — dev / staging ONLY.
      useInsecureTrustManager = true
    }

    # ---- Redirect following ----
    # The protocol builder already calls disableFollowRedirect().
    # This entry is explicit for visibility.
    maxRedirects = 0

    # ---- Keep-alive ----
    # Aligned with the server's keep-alive timeout; prevents "connection reset" noise.
    warmUpUrl = ""   # disable Gatling's built-in warm-up request
  }

  data {
    # ---- Writers: which recorders to enable ----
    # "file"    → writes simulation.log (raw event stream, parseable by CI)
    # "console" → prints per-second stats to stdout (good for watching live)
    writers = [console, file]

    console {
      # How often the console writer flushes a stats line (seconds).
      writePeriod = 5
    }

    file {
      # simulation.log is written to the resultsFolder automatically.
      # Set bufferSize high enough to avoid I/O becoming a bottleneck.
      bufferSize = 8192
    }
  }
}
