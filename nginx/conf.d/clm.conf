# ==============================================================================
# CLM Platform — Nginx reverse-proxy configuration
# ==============================================================================
# Topology:
#   Internet → Nginx :443 (TLS termination)
#     /              → client (Next.js frontend)
#     /api/auth/login    → user-service (Spring — exact match)
#     /api/auth/register → user-service (Spring — exact match)
#     /api/auth/**   → frontend (Next.js / NextAuth — everything else)
#     /api/users/**  → user-service
#     /api/contracts/**  → contract-service
#     /api/appendices/** → contract-service
#     /api/templates/**  → contract-service
#     /api/clients/**    → client-service
#     /api/tasks/**      → client-service
#     /api/enums/**      → client-service
#     /api/notifications/** → notification-service (testing only — remove later)
#     /docs/         → swagger-hub
#     /grafana/      → grafana
#
#   Prometheus stays on data-net only — never routed externally.
#   /actuator/** is blocked at this layer regardless of service config.
# ==============================================================================

# ── Shared proxy header snippet ───────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name localhost;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/clm.crt;
    ssl_certificate_key /etc/nginx/certs/clm.key;

    # Modern TLS only — drop SSLv3, TLSv1.0, TLSv1.1.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Global request size limit ─────────────────────────────────────────────
    client_max_body_size 20m;

    # ── Block actuator endpoints at proxy level ───────────────────────────────
    # Belt-and-suspenders: even if Spring Security is misconfigured, actuator
    # is never reachable from outside the Docker network.
    location ~* /actuator {
        return 403;
    }

    # ── User service ──────────────────────────────────────────────────────────
    # Spring's /api/auth/login and /api/auth/register are routed here explicitly.
    # NextAuth owns /api/auth/signin|signout|callback|session|csrf|error|providers
    # — those fall through to the catch-all → Next.js. The two Spring paths are
    # distinct from all NextAuth paths so exact matches are safe.
    location = /api/auth/login {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://user_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location = /api/auth/register {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://user_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Exact /api/users (no slash) → Next.js, which adds the Bearer token from
    # the session cookie before calling user-service internally.
    # Must be an exact match to prevent nginx's built-in trailing-slash redirect.
    location = /api/users {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # /api/users/ and sub-paths → user-service directly (Swagger UI, service-to-service).
    # Spring Boot 7 dropped trailing-slash matching; the rewrite strips the
    # exact trailing slash so @GetMapping on @RequestMapping("/api/users") matches.
    location /api/users/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        rewrite ^/api/users/$ /api/users break;

        proxy_pass         http://user_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Contract service ──────────────────────────────────────────────────────
    # Controller prefixes: /api/contracts, /api/appendices, /api/templates
    location /api/contracts/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        rewrite ^/api/contracts/$ /api/contracts break;

        proxy_pass         http://contract_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /api/appendices/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        rewrite ^/api/appendices/$ /api/appendices break;

        proxy_pass         http://contract_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /api/templates/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        rewrite ^/api/templates/$ /api/templates break;

        proxy_pass         http://contract_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Client service ────────────────────────────────────────────────────────
    # Controller prefixes: /api/clients, /api/tasks, /api/enums
    location /api/clients/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        rewrite ^/api/clients/$ /api/clients break;

        proxy_pass         http://client_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /api/tasks/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        rewrite ^/api/tasks/$ /api/tasks break;

        proxy_pass         http://client_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /api/enums {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://client_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Notification service (testing only — remove before production) ────────
    # Controller prefix is /notifications — rewrite strips /api/notifications/
    # and replaces with /notifications/ before forwarding.
    location /api/notifications/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://notifications_service/notifications/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Swagger Hub ───────────────────────────────────────────────────────────
    location /docs/ {
        proxy_pass         http://swagger_hub/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Grafana ───────────────────────────────────────────────────────────────
    # No trailing slash on proxy_pass — Nginx must forward the full /grafana/
    # prefix so Grafana (GF_SERVER_SERVE_FROM_SUB_PATH=true) can handle it.
    location /grafana/ {
        proxy_pass         http://grafana;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support for Grafana live updates.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # ── Frontend (Next.js) — catch-all ────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support for Next.js HMR in dev mode.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
