spring.application.name=notifications

# Port (contracts runs on 8080, so notifications uses 8082)
server.port=${NOTIFICATIONS_PORT:8082}

# ─────────────────────────────────────────────────────────────────────────────
# Contracts microservice base URL
# ─────────────────────────────────────────────────────────────────────────────
contracts.api.base-url=${CONTRACTS_API_BASE_URL:http://localhost:8080}

# JWT – shared secret for service-to-service calls
jwt.secret=${JWT_SECRET:local-dev-only-secret-do-not-use-in-prod-min32}

# ─────────────────────────────────────────────────────────────────────────────
# Mail (SMTP)
# For Gmail use: smtp.gmail.com / port 587 / starttls enabled
# ─────────────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=contractplatform@gmail.com
spring.mail.password=yggqvnsfdedsvpzz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─────────────────────────────────────────────────────────────────────────────
# Notification settings
# ─────────────────────────────────────────────────────────────────────────────

# Comma-separated list of recipient email addresses (contabili care primesc raportul)
notification.recipients=mirunaandreeastefan@gmail.com

# From address shown in the email
notification.from=${NOTIFICATION_FROM:contractplatform@gmail.com}

# Cron: "0 0 8 1 * *" = 8:00 AM on the 1st day of every month
notification.cron=${NOTIFICATION_CRON:0 0 8 * * *}

# How many days ahead to look for expiring contracts
notification.expiry-warning-days=${NOTIFICATION_EXPIRY_DAYS:30}

# How many months of inactivity before a client is flagged as not renegotiated
notification.inactivity-months=${NOTIFICATION_INACTIVITY_MONTHS:6}
