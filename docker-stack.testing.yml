version: "3.9"

services:

  # ── Main application database ──────────────────────────────────────────────
  postgres:
    image: clm/clm-db:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_USER:        ${DB_USER:-clm_user}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:-clm_password_dev}
      POSTGRES_DB:          ${DB_NAME:-clm_platform}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - target:    5432
        published: ${DB_EXPOSE_PORT:-5433}
        protocol:  tcp
        mode:      host
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_NAME:-clm_platform}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── User-service database ──────────────────────────────────────────────────
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:        ${DB_USER:-clm_user}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:-clm_password_dev}
      POSTGRES_DB:          ${DB_USERS_NAME:-clm_users}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    ports:
      - target:    5432
        published: ${DB_USERS_EXPOSE_PORT:-5434}
        protocol:  tcp
        mode:      host
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_USERS_NAME:-clm_users}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Client-service database ────────────────────────────────────────────────
  postgres-clients:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:        ${DB_USER:-clm_user}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:-clm_password_dev}
      POSTGRES_DB:          ${DB_CLIENTS_NAME:-clm_clients}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_clients_data:/var/lib/postgresql/data
    ports:
      - target:    5432
        published: ${DB_CLIENTS_EXPOSE_PORT:-5435}
        protocol:  tcp
        mode:      host
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_CLIENTS_NAME:-clm_clients}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Negotiation-service database ───────────────────────────────────────────
  postgres-negotiations:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:        ${DB_USER:-clm_user}
      POSTGRES_PASSWORD:    ${DB_PASSWORD:-clm_password_dev}
      POSTGRES_DB:          ${DB_NEGOTIATIONS_NAME:-clm_negotiations}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_negotiations_data:/var/lib/postgresql/data
    ports:
      - target:    5432
        published: ${DB_NEGOTIATIONS_EXPOSE_PORT:-5436}
        protocol:  tcp
        mode:      host
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-clm_user}", "-d", "${DB_NEGOTIATIONS_NAME:-clm_negotiations}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── User service (auth + JWT) ──────────────────────────────────────────────
  user-service:
    image: clm/clm-user-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-users:5432/${DB_USERS_NAME:-clm_users}?currentSchema=users
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:-clm_password_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: users
      SPRING_FLYWAY_ENABLED:        "true"
      SPRING_FLYWAY_LOCATIONS:      classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:        users
      SPRING_FLYWAY_DEFAULT_SCHEMA: users
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2592000000}
      APP_ADMIN_EMAIL:          ${ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD:       ${ADMIN_PASSWORD:-Admin123!}
      APP_ADMIN_NAME:           ${ADMIN_NAME:-Admin}
      APP_ADMIN_REGISTER_CODE:  ${ADMIN_REGISTER_CODE:-devcode123}
      APP_CORS_ALLOWED_ORIGINS: https://localhost
      SPRINGDOC_SWAGGER_UI_PATH:  /api/users/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/users/v3/api-docs
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       user-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_USER_DEMO:       DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_CONFIG_ANNOTATION_AUTHENTICATION_CONFIGURATION: ERROR
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Contract service ───────────────────────────────────────────────────────
  contracts:
    image: clm/clm-contracts:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/${DB_NAME:-clm_platform}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:-clm_password_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clm
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   clm
      JWT_SECRET:          ${JWT_SECRET}
      APP_JWT_SECRET:      ${JWT_SECRET}
      APP_JWT_EXPIRATION:  ${JWT_EXPIRATION:-2592000000}
      APP_ADMIN_REGISTER_CODE: ${ADMIN_REGISTER_CODE:-devcode123}
      SPRING_MAIL_HOST:                                   ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT:                                   ${MAIL_PORT:-2525}
      SPRING_MAIL_USERNAME:                               ${MAIL_USERNAME:-your-mailtrap-username}
      SPRING_MAIL_PASSWORD:                               ${MAIL_PASSWORD:-your-mailtrap-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:              "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:   "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SPRING_MAIL_FROM:                                   ${MAIL_FROM:-noreply@dev.example.com}
      APP_EMAIL_VERIFICATION_EXPIRATION: ${EMAIL_VERIFICATION_EXPIRATION:-86400000}
      APP_FRONTEND_URL:                ${FRONTEND_URL:-https://localhost}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: https://localhost
      NEGOTIATION_SERVICE_URL: ${NEGOTIATION_SERVICE_URL:-http://negotiation-service:8085}
      LIBREOFFICE_PATH: ${LIBREOFFICE_PATH:-/usr/bin/libreoffice}
      SPRINGDOC_SWAGGER_UI_PATH:  /api/contracts/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/contracts/v3/api-docs
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       contract-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_DEMO:            DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Client service ─────────────────────────────────────────────────────────
  client-service:
    image: clm/clm-client-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-clients:5432/${DB_CLIENTS_NAME:-clm_clients}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:-clm_password_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: clients
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   clients
      JWT_SECRET:           ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://localhost
      SPRINGDOC_SWAGGER_UI_PATH:  /api/clients/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/clients/v3/api-docs
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       client-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Notification service ───────────────────────────────────────────────────
  notifications:
    image: clm/clm-notifications:${IMAGE_TAG:-latest}
    environment:
      SPRING_MAIL_HOST:                                  ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT:                                  ${MAIL_PORT:-2525}
      SPRING_MAIL_USERNAME:                              ${MAIL_USERNAME:-your-mailtrap-username}
      SPRING_MAIL_PASSWORD:                              ${MAIL_PASSWORD:-your-mailtrap-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:             "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:  "true"
      SPRING_MAIL_FROM:                                  ${MAIL_FROM:-noreply@dev.example.com}
      CONTRACTS_SERVICE_URL:   ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      CONTRACTS_API_BASE_URL:  ${CONTRACTS_SERVICE_URL:-http://contracts:8081}
      JWT_SECRET:              ${JWT_SECRET}
      NOTIFICATION_RECIPIENTS: ${NOTIFICATION_RECIPIENTS:-}
      APP_FRONTEND_URL:                ${FRONTEND_URL:-https://localhost}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: https://localhost
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_NOTIFICATIONS:   DEBUG
    networks:
      - data-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Negotiation service ────────────────────────────────────────────────────
  negotiation-service:
    image: clm/clm-negotiation-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres-negotiations:5432/${DB_NEGOTIATIONS_NAME:-clm_negotiations}
      SPRING_DATASOURCE_USERNAME:          ${DB_USER:-clm_user}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASSWORD:-clm_password_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO:               validate
      SPRING_JPA_SHOW_SQL:                         "false"
      SPRING_JPA_OPEN_IN_VIEW:                     "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: negotiations
      SPRING_FLYWAY_ENABLED:   "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS:   negotiations
      JWT_SECRET:              ${JWT_SECRET}
      CONTRACTS_SERVICE_URL:   http://contracts:8081
      SPRINGDOC_SWAGGER_UI_PATH:  /api/negotiations/swagger-ui.html
      SPRINGDOC_API_DOCS_PATH:    /api/negotiations/v3/api-docs
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,metrics,info
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:        /actuator
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   always
      MANAGEMENT_METRICS_TAGS_APPLICATION:       negotiation-service
      JAVA_TOOL_OPTIONS: "-Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true -Dmanagement.metrics.distribution.slo.http.server.requests=500ms,2000ms"
      LOGGING_LEVEL_ROOT:                INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_CLM_NEGOTIATION:     DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC_CORE_EVENTS: ERROR
      SPRING_MAIL_HOST:                                   ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT:                                   ${MAIL_PORT:-2525}
      SPRING_MAIL_USERNAME:                               ${MAIL_USERNAME:-your-mailtrap-username}
      SPRING_MAIL_PASSWORD:                               ${MAIL_PASSWORD:-your-mailtrap-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:              "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:   "true"
      NOTIFICATION_FROM:                                  ${MAIL_FROM:-noreply@dev.example.com}
      NOTIFICATION_RECIPIENTS:                            ${NOTIFICATION_RECIPIENTS:-}
      NEGOTIATION_NOTIFICATION_CRON:                      ${NEGOTIATION_NOTIFICATION_CRON:-0 0 9 1 * *}
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Swagger hub ────────────────────────────────────────────────────────────
  swagger-hub:
    image: clm/clm-swagger-hub:${IMAGE_TAG:-latest}
    environment:
      PORT: "8090"
    networks:
      - data-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Frontend (Next.js dev server — hot reload) ────────────────────────────
  microcrm2:
    image: clm/clm-microcrm2:${IMAGE_TAG:-latest}
    volumes:
      - type: bind
        source: /Users/gabrielcarauleanu/Desktop/CLM-platform/frontend
        target: /app
      - type: volume
        source: microcrm2_node_modules
        target: /app/node_modules
    environment:
      NODE_ENV:                 development
      NEXT_TELEMETRY_DISABLED:  "1"
      NEXT_PUBLIC_API_BASE_URL:          ${NEXT_PUBLIC_API_BASE_URL:-https://localhost}
      NEXT_PUBLIC_CONTRACTS_API_URL:     ${NEXT_PUBLIC_CONTRACTS_API_URL:-https://localhost/api/contracts}
      NEXT_PUBLIC_NOTIFICATIONS_API_URL: ${NEXT_PUBLIC_NOTIFICATIONS_API_URL:-https://localhost/api/notifications}
      NEXT_PUBLIC_USER_SERVICE_URL:      ${NEXT_PUBLIC_USER_SERVICE_URL:-https://localhost/api/users}
      NEXT_PUBLIC_CLIENT_SERVICE_URL:    ${NEXT_PUBLIC_CLIENT_SERVICE_URL:-https://localhost/api/clients}
      CONTRACTS_SERVICE_URL:     http://contracts:8081
      NOTIFICATIONS_SERVICE_URL: http://notifications:8082
      USER_SERVICE_URL:          http://user-service:8083
      CLIENT_SERVICE_URL:        http://client-service:8084
      NEGOTIATION_SERVICE_URL:   http://negotiation-service:8085
      ADMIN_REGISTER_CODE:  ${ADMIN_REGISTER_CODE:-devcode123}
      NEXTAUTH_URL:    ${FRONTEND_URL:-https://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        mode: 0444
    volumes:
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: clm/clm-grafana:${IMAGE_TAG:-latest}
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-Admin123!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SERVER_ROOT_URL=https://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - TZ=UTC
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ── Nginx (TLS termination + reverse proxy) ────────────────────────────────
  nginx:
    image: clm/clm-nginx:${IMAGE_TAG:-latest}
    ports:
      - target:    80
        published: 80
        protocol:  tcp
        mode:      ingress
      - target:    443
        published: 443
        protocol:  tcp
        mode:      ingress
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - dmz-net
      - data-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  dmz-net:
    driver: overlay
    attachable: true
  data-net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
  postgres_users_data:
    driver: local
  postgres_clients_data:
    driver: local
  postgres_negotiations_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  microcrm2_node_modules:
    driver: local

configs:
  prometheus_config:
    file: ./monitoring/prometheus/prometheus.yml
