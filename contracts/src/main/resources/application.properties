spring.application.name=demo

# dataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clm_platform}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clm_password}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# hibernate Schema Configuration - use contracts schema
spring.jpa.properties.hibernate.default_schema=contracts

# flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.docx4j.fonts=WARN
logging.level.org.docx4j.fonts.autodetect.FontInfoFinder=ERROR
logging.level.org.docx4j.fonts.PhysicalFonts=ERROR
logging.level.org.apache.fop.apps.FOUserAgent=ERROR
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.fail-on-missing-locations=false
spring.flyway.clean-disabled=true
spring.flyway.encoding=UTF-8

# Scheduled Jobs Configuration
job.archive-contracts.cron=${JOB_ARCHIVE_CONTRACTS_CRON:0 0 0 * * *}

# Placeholder Configuration
placeholder.pattern=${PLACEHOLDER_PATTERN:\\.{4,}(?:[ \\t]*\\.+)*}
placeholder.default=${PLACEHOLDER_DEFAULT:....}

