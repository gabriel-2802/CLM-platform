spring.application.name=demo-test

# Test datasource — populated by the clm-test-pg container started by `make test-cache-real`
spring.datasource.url=jdbc:postgresql://localhost:5434/clm_test
spring.datasource.username=clm_user
spring.datasource.password=clm_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# suppress noisy framework logs, keep application debug visible
logging.level.clm.demo=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN

# disable springdoc auto-configuration in slice tests so it doesn't
# interfere with @WebMvcTest handler-mapping setup
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
