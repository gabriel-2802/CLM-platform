<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CLM API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; }
    #nav {
      display: flex; align-items: center; gap: 8px;
      background: #1a1a1a; padding: 12px 20px; border-bottom: 1px solid #333;
      position: sticky; top: 0; z-index: 999;
    }
    #nav span { color: #aaa; font-size: 13px; margin-right: 4px; }
    .tab {
      padding: 7px 18px; border-radius: 6px; border: 1px solid #444;
      background: #2a2a2a; color: #ccc; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all .15s;
    }
    .doc-link {
      padding: 7px 10px; border-radius: 6px; border: 1px solid #444;
      background: #1f1f1f; color: #7fc8ff; text-decoration: none;
      font-size: 12px; font-weight: 600; transition: all .15s;
    }
    .doc-link:hover { border-color: #7fc8ff; color: #cfeaff; }
    .tab:hover { border-color: #888; color: #fff; }
    .tab.active { background: #2d7d46; border-color: #2d7d46; color: #fff; }
    #swagger-ui { background: #fff; }
    .swagger-ui .topbar { display: none !important; }
  </style>
</head>
<body>
  <div id="nav">
    <span>Service:</span>
    <button class="tab active" onclick="load('contracts')">Contracts :8081</button>
    <a class="doc-link" href="http://localhost:8081/v3/api-docs" target="_blank" rel="noreferrer">JSON</a>
    <button class="tab"        onclick="load('user')">User :8083</button>
    <a class="doc-link" href="http://localhost:8083/v3/api-docs" target="_blank" rel="noreferrer">JSON</a>
    <button class="tab"        onclick="load('client')">Client :8084</button>
    <a class="doc-link" href="http://localhost:8084/v3/api-docs" target="_blank" rel="noreferrer">JSON</a>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    const urls = {
      contracts: '/proxy/contracts',
      user:      '/proxy/user',
      client:    '/proxy/client',
    };

    let ui;
    function load(service) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      if (ui) { ui = null; document.getElementById('swagger-ui').innerHTML = ''; }
      ui = SwaggerUIBundle({
        url: urls[service],
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        deepLinking: true,
        tryItOutEnabled: true,
      });
    }

    ui = SwaggerUIBundle({
      url: urls.contracts,
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      deepLinking: true,
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
