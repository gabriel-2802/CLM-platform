# Tuned for mem_limit = 512m (production) / unbound (testing)
listen_addresses     = '*'     # accept connections from all Docker bridge interfaces
shared_buffers       = 128MB   # ~25% of 512m hard limit
work_mem             = 4MB     # per sort/hash op; multiply by max_connections for worst-case RSS
maintenance_work_mem = 64MB    # VACUUM, CREATE INDEX — only one active at a time typically
max_connections      = 100     # default 100; each idle connection costs ~5MB

# WAL
wal_level            = replica # minimal overhead; required if you ever add a standby or logical replication

# Checkpoints
checkpoint_completion_target = 0.9  # spread checkpoint I/O over 90% of the interval

# Logging — keep quiet in production; errors only
log_min_messages     = WARNING
log_min_error_statement = ERROR
